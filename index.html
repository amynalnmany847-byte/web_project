<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة المهام الذكية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🚀 نظام إدارة المهام والمشاريع</h1>
            <p>تنظيم ومتابعة المهام البرمجية بكل كفاءة وسهولة</p>
        </div>
    </header>

    <main class="container main-content">
        <section class="card">
            <h2>➕ إضافة مهمة جديدة</h2>
            <div class="task-form">
                <input type="text" id="taskInput" placeholder="أدخل عنوان المهمة البرمجية...">
                <button id="addTaskBtn" class="btn-primary">إضافة للمسار</button>
            </div>
        </section>

        <section class="card">
            <h2>📋 قائمة المهام النشطة</h2>
            <ul id="taskList" class="task-list"></ul>
        </section>
    </main>

    <footer class="footer">
        <p>جميع الحقوق محفوظة © 2026 | نظام إدارة المشاريع الذكي</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
